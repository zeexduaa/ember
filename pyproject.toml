[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-lang"
version = "0.1.0"
description = "A small statically typed language with a bytecode VM, written in pure Python"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Syed Ali" }]
keywords = ["programming-language", "compiler", "interpreter", "bytecode", "type-checker"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Interpreters",
]

[project.scripts]
ember = "ember.cli:main"

[project.urls]
Homepage = "https://github.com/zeexduaa/ember"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ember = ["stdlib/*.em"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
