name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e . pytest
      - name: Tests (including every example program)
        run: python -m pytest -q
      - name: The command line works
        shell: bash
        run: |
          ember --version
          ember check examples/*.em examples/modules/main.em
          ember run examples/hello.em
          ember eval 'print([1, 2, 3].map(fn(x) { x * x }).sum())'
          printf 'let x = 20\nx + 1\n' | ember repl
          ember test examples
